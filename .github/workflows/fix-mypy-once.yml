name: Fix MyPy once

on:
  push:
    branches:
      - agent/bootstrap-foundation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bootstrap-foundation

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Apply strict-typing corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/verify_compatibility/profiles.py"): [
                  (
                      'files("verify_compatibility").joinpath("data", group, name)',
                      'files("verify_compatibility").joinpath("data").joinpath(group).joinpath(name)',
                  ),
                  (
                      'files("verify_compatibility").joinpath("data", "profiles")',
                      'files("verify_compatibility").joinpath("data").joinpath("profiles")',
                  ),
                  (
                      '        path = PurePosixPath(adapter)\n'
                      '        if path.is_absolute() or ".." in path.parts or adapter.endswith("/"):',
                      '        adapter_path = PurePosixPath(adapter)\n'
                      '        if adapter_path.is_absolute() or ".." in adapter_path.parts or adapter.endswith("/"): ',
                  ),
              ],
              Path("src/verify_compatibility/cli.py"): [
                  (
                      'files("verify_compatibility").joinpath("skill", "verify-compatibility")',
                      'files("verify_compatibility").joinpath("skill").joinpath("verify-compatibility")',
                  ),
              ],
              Path("tests/test_profiles.py"): [
                  (
                      'files("verify_compatibility").joinpath("skill", "verify-compatibility")',
                      'files("verify_compatibility").joinpath("skill").joinpath("verify-compatibility")',
                  ),
              ],
              Path("src/verify_compatibility/__main__.py"): [
                  (
                      'from .cli import main\n',
                      'from .cli import main\n\n__all__ = ["main"]\n',
                  ),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected one match in {path} for {old!r}; found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check --fix .
          ruff format .
          mypy
          pytest

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Fix strict typing diagnostics"
          git push origin HEAD:agent/bootstrap-foundation

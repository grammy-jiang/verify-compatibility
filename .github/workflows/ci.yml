name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Test
        run: pytest

  quality:
    name: Lint, type-check, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy

      - name: Measure coverage
        run: pytest --cov=verify_compatibility --cov-report=term-missing

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip && pip install build

      - name: Build
        run: python -m build

      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/verify-compatibility-wheel"
          "$RUNNER_TEMP/verify-compatibility-wheel/bin/python" -m pip install dist/*.whl

      - name: Verify packaged profiles and skill
        run: |
          cli="$RUNNER_TEMP/verify-compatibility-wheel/bin/verify-compatibility"
          "$cli" profiles
          skill_path=$("$cli" skill-path)
          test -f "$skill_path/SKILL.md"
          "$cli" audit "$skill_path" --kind skill --format json

  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Cache hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install pre-commit

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure

# Managed with the manage-precommit skill -- https://pre-commit.com
# Install the git hook:  pre-commit install
# Run on all files:      pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
exclude: '^\.gitignore$'
repos:
  # Base hygiene -- fast, universal checks from the pre-commit maintainers.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
  # YAML linter -- config lives in the repo's .yamllint.yaml (copied by the skill).
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  # Markdown linter -- config lives in the repo's .markdownlint.yaml (copied by the skill).
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  # Mermaid diagram validator -- local hook running the bundled scripts/lint-mermaid.mjs.
  # No upstream pre-commit hook exists; mermaid's real parser needs a browser, so
  # mermaid-cli (headless Chromium) is pulled in via additional_dependencies.
  - repo: local
    hooks:
      - id: mermaid-lint
        name: mermaid-lint
        description: Validate fenced mermaid code blocks with mermaid-cli
        entry: node scripts/lint-mermaid.mjs
        language: node
        files: '\.(md|markdown)$'
        additional_dependencies:
          - "@mermaid-js/mermaid-cli@11.16.0"
  # Secret scanner -- blocks commits that contain credentials/tokens.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

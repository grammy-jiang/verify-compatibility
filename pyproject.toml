[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verify-compatibility"
version = "0.1.0a0"
description = "Audit Agent Skills and MCP servers across Claude Code, GitHub Copilot, and Codex"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Grammy Jiang", email = "grammy.jiang@gmail.com" }]
keywords = [
  "agent-skills",
  "mcp",
  "claude-code",
  "github-copilot",
  "codex",
  "compatibility",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/grammy-jiang/verify-compatibility"
Repository = "https://github.com/grammy-jiang/verify-compatibility"
Issues = "https://github.com/grammy-jiang/verify-compatibility/issues"

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "mypy>=1.8",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff==0.16.1",
  "types-PyYAML>=6.0",
]

[project.scripts]
verify-compatibility = "verify_compatibility.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verify_compatibility"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/verify_compatibility"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/verify_compatibility", "tests"]
strict = true
warn_unreachable = true
